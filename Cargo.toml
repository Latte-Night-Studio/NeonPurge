[package]
name = "neon-purge"
version = "1.1.0"
edition = "2021"
description = "A fast top-down arena shooter written in pure Rust"

[dependencies]
minifb = "0.29"

# The game renders its own pixels, so a little optimization goes a long way.
[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
